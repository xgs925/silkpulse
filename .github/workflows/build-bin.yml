name: Build Server Bin (glibc 2.17 兼容)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:7
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 修复 yum 源为 vault（centos 7 已 EOL）
        run: |
          sed -i 's|^mirrorlist=|#mirrorlist=|g' /etc/yum.repos.d/CentOS-*.repo
          sed -i 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
          yum makecache

      - name: 装 gcc 9 + python3 + 基础工具
        run: |
          yum -y install centos-release-scl epel-release
          yum -y install devtoolset-9-gcc devtoolset-9-gcc-c++ devtoolset-9-binutils
          yum -y install python3 xz tar wget git make

      - name: 装 Node 22（glibc 2.17 兼容预编译）
        run: |
          cd /tmp
          wget -q https://unofficial-builds.nodejs.org/download/release/v22.22.3/node-v22.22.3-linux-x64-glibc-217.tar.gz
          tar -xzf node-v22.22.3-linux-x64-glibc-217.tar.gz
          export PATH="$PWD/node-v22.22.3-linux-x64-glibc-217/bin:$PATH"
          ln -sf $PWD/node-v22.22.3-linux-x64-glibc-217/bin/node /usr/local/bin/node
          ln -sf $PWD/node-v22.22.3-linux-x64-glibc-217/bin/npm /usr/local/bin/npm
          ln -sf $PWD/node-v22.22.3-linux-x64-glibc-217/bin/npx /usr/local/bin/npx
          node --version
          npm install -g pnpm@11

      - name: pnpm install
        run: |
          source /opt/rh/devtoolset-9/enable
          cd /github/workspace
          pnpm install --frozen-lockfile

      - name: 强制 uWS 从源码编译（链接容器的 glibc 2.17）
        run: |
          source /opt/rh/devtoolset-9/enable
          cd /github/workspace
          # 删掉 npm 包自带的 glibc 2.38+ 预编译二进制
          rm -f node_modules/uWebSockets.js/*.node
          # 用 devtoolset-9 的 gcc 重新编译
          cd node_modules/uWebSockets.js
          node-gyp rebuild --release 2>&1 | tail -20
          ls -la *.node

      - name: 构建 silkpulse
        run: |
          source /opt/rh/devtoolset-9/enable
          cd /github/workspace
          pnpm build

      - name: 打包 dist/bin
        run: |
          cd /github/workspace
          tar czf silkpulse-bin-linux-x64-glibc217.tar.gz -C packages/server/dist/bin .

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: silkpulse-bin-linux-x64-glibc217
          path: silkpulse-bin-linux-x64-glibc217.tar.gz
