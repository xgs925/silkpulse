name: Build Server Bin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 打包 bin
        run: |
          cd packages/server/dist/bin
          tar czf ../../../silkpulse-bin-linux-x64.tar.gz .

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: silkpulse-bin-linux-x64
          path: silkpulse-bin-linux-x64.tar.gz
